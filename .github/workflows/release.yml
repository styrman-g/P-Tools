name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Prepare application icon
        run: >-
          python -c
          "from PIL import Image; Image.open('src/icons/icon.PNG').save('app.ico', sizes=[(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)])"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          $ffmpegFolder = Get-ChildItem ffmpeg-download -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegFolder.FullName)\bin\ffmpeg.exe" .
          Copy-Item "$($ffmpegFolder.FullName)\bin\ffprobe.exe" .

      - name: Build executable
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name P-Tools
          --icon app.ico
          --add-data "src/icons;icons"
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          src/main.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/P-Tools.exe
          generate_release_notes: true
          name: P-Tools ${{ github.ref_name }}
